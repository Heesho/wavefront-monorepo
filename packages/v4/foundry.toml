[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["node_modules", "lib"]
solc_version = "0.8.26"
evm_version = "cancun"
via_ir = true
optimizer = true
optimizer_runs = 200
# The v1 contracts are the reference oracle: tests deploy them from packages/foundry's build output.
fs_permissions = [{ access = "read", path = "../foundry/out" }]
remappings = [
    "forge-std/=lib/forge-std/src/",
    "@uniswap/v4-core/=node_modules/@uniswap/v4-core/",
    "@uniswap/v4-periphery/=node_modules/@uniswap/v4-periphery/",
    "@openzeppelin/contracts/=node_modules/@openzeppelin/contracts/",
    "solmate/=node_modules/solmate/",
]

[fuzz]
runs = 1000

[invariant]
runs = 256
depth = 64
fail_on_revert = false

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = false
int_types = "long"
quote_style = "double"
number_underscore = "thousands"
sort_imports = true

[profile.ci.fuzz]
runs = 10000

[profile.ci.invariant]
runs = 1000
depth = 100
